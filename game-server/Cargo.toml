[package]
name = "game-server"
version = "0.1.0"
edition = "2021"

[lib]
name = "game_server"
path = "src/lib.rs"

[[bin]]
name = "game-server"
path = "src/main.rs"

[dependencies]
futures-util = "0.3.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-tungstenite = "0.30.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dev-dependencies]
tungstenite = "0.30.0"
